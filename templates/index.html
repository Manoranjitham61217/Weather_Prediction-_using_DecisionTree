<!DOCTYPE html>
<html>
<head>
    <title>Weather Prediction</title>
    <style>
        body {font-family: Arial; background: #f2f2f2; padding: 40px;}
        .container {
            width: 420px; margin: auto; padding: 20px;
            background: white; border-radius: 10px;
            box-shadow: 0px 0px 10px #aaa;
        }
        input, select {
            width: 100%; padding: 10px; margin: 8px 0;
            border-radius: 5px; border: 1px solid #aaa;
        }
        button {
            width: 100%; padding: 12px;
            background: #007bff; color: white;
            border: none; border-radius: 5px;
            font-size: 16px; cursor: pointer;
        }
        button:hover {background: #0056b3;}
        .result {
            margin-top: 15px; padding: 10px;
            background: #e2ffe2; border-left: 5px solid green;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🌦 Weather Prediction</h2>

    <form action="/predict" method="POST">

        <label>Temperature</label>
        <input type="number" name="temperature" required>

        <label>Humidity</label>
        <input type="number" name="humidity" required>

        <label>Precipitation (%)</label>
        <input type="number" name="precipitation" required>

        <label>Cloud Cover</label>
        <input type="number" name="cloud_cover" required>

        <label>UV Index</label>
        <input type="number" name="uv_index" required>

        <label>Season</label>
        <select name="season" required>
            <option value="">Select Season</option>
            <option value="0">Winter</option>
            <option value="1">Spring</option>
            <option value="2">Summer</option>
            <option value="3">Autumn</option>
        </select>

        <label>Visibility (km)</label>
        <input type="number" name="visibility" required>

        <button type="submit">Predict</button>
    </form>

    {% if result %}
    <div class="result">
        <strong>Prediction:</strong> {{ result }}
    </div>
    {% endif %}

</div>

</body>
</html>
